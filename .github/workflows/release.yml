# Publie une nouvelle version quand on pousse une étiquette (ex. v1.0.1) :
# crée Bubulle.zip (uniquement les fichiers de l'addon) et l'attache à une
# "Release" GitHub. Si un jour le projet existe sur CurseForge, il suffira
# d'ajouter le secret CF_API_KEY et la ligne "## X-Curse-Project-ID" au .toc
# pour que la version y parte aussi.
name: Release

on:
  push:
    tags:
      - "v*"
  # Ou à la main, depuis l'onglet Actions : "Run workflow" avec le numéro
  # de version (ex. 1.0.1). L'étiquette vX.Y.Z est alors créée ici.
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version (ex. 1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Créer l'étiquette (lancement manuel)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" -m "Bubulle ${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
